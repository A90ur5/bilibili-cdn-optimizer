# Publishes a GitHub release with both Chrome extension zips.
#
# Push a tag starting with v (e.g. `git tag v2026.10.18 && git push origin v2026.10.18`), or run it by hand
# from the Actions tab with a tag name. Both build scripts run with --check first, so a zip that no longer
# matches its source fails the release instead of shipping. tools/release.js writes the notes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create the release for (created on the selected commit if it does not exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zips match their sources
        run: |
          node bilibili-cdn-optimizer/tools/build-extension.js --check
          node bilibili-cdn-tw/tools/build-extension-tw.js --check
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node tools/release.js "$TAG"
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$(cat dist/title.txt)" \
            --notes-file dist/notes.md
